name: Sync Webflow image assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download public image assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -L --fail --retry 3 "https://drive.google.com/uc?export=download&id=1bQ-J5OZ7jZ2sjZpido0Jh0551l759YGr" -o assets/enfants-adolescents.jpg
          curl -L --fail --retry 3 "https://drive.google.com/uc?export=download&id=1kedCklRGTF7qDSj28TNO7YOQNYGnwVAU" -o assets/seniors.jpg
          curl -L --fail --retry 3 "https://drive.google.com/uc?export=download&id=1en_djhRcL5Di1ZQ6ZIDa2H3j_SJe2eps" -o assets/post-partum.jpg
          curl -L --fail --retry 3 "https://drive.google.com/uc?export=download&id=11JjpYwSQHnAw5rPwYg4jCl0ASqlwgokY" -o assets/pre-post-intervention.jpg
          curl -L --fail --retry 3 "https://drive.google.com/uc?export=download&id=1piyrCRwx1Xdu_8QUWNALo8b3sEgSOiEa" -o assets/cabinet-savigny-illustration.jpg
          curl -L --fail --retry 3 "https://drive.google.com/uc?export=download&id=15pp1y7ptWLIo60USPsErb2blzwOIuIRF" -o assets/cabinet-lagny-illustration.jpg

          for f in assets/*.jpg; do
            file "$f"
            file "$f" | grep -qiE "JPEG|image data"
          done

      - name: Commit assets
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets && [ -z "$(git ls-files --others --exclude-standard assets)" ]; then
            echo "No asset changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Sync Webflow image assets"
          git push
